<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои задачи</title>

  <style>
    body {
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      font: 18px Arial;
      background: #f0f4ff;
    }

    input, button {
      padding: 12px;
      font: inherit;
      margin-bottom: 10px;
    }

    button {
      background: #2678e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    li {
      margin: 12px 0;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>Моё первое приложение</h1>

  <form id="form">
    <input id="task" placeholder="Напиши задачу" required>
    <button>Добавить</button>
  </form>

  <ul id="list"></ul>
<script>
  const form = document.getElementById('form');
  const input = document.getElementById('task');
  const list = document.getElementById('list');
  let tasks = [];

  try {
    const saved = JSON.parse(localStorage.getItem('myTasks') || '[]');

    if (Array.isArray(saved)) {
      tasks = saved.map(task =>
        typeof task === 'string' ? { text: task, done: false } : task
      ).filter(task =>
        task && typeof task.text === 'string' && typeof task.done === 'boolean'
      );
    }
  } catch {}

  function saveTasks() {
    try {
      localStorage.setItem('myTasks', JSON.stringify(tasks));
    } catch {
      alert('Изменения видны на экране, но сохранить их не удалось.');
    }
  }

  function drawTasks() {
  list.replaceChildren();

  const orderedTasks = [...tasks].sort((a, b) =>
    (b.important ? 1 : 0) - (a.important ? 1 : 0)
  );

  orderedTasks.forEach(task => {
    const item = document.createElement('li');

    const star = document.createElement('button');
    star.type = 'button';
    star.textContent = task.important ? '★' : '☆';

    star.setAttribute('aria-pressed', String(Boolean(task.important)));
    star.setAttribute('aria-label',
      (task.important ? 'Снять важность: ' : 'Отметить важной: ') + task.text
    );

    star.style.background = task.important ? '#f5b700' : '#64748b';
    star.style.color = task.important ? '#222222' : 'white';

    star.onclick = function() {
      task.important = !task.important;
      saveTasks();
      drawTasks();
    };

    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = task.done;

    const title = document.createElement('span');
    title.textContent = ' ' + task.text + ' ';

    function updateTitle() {
      title.style.textDecoration = task.done ? 'line-through' : 'none';
      title.style.color = task.done ? '#6b7280' : 'inherit';
    }

    checkbox.onchange = function() {
      task.done = checkbox.checked;
      updateTitle();
      saveTasks();
    };

    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'Удалить';

    button.onclick = function() {
      const index = tasks.indexOf(task);
      if (index < 0) return;

      tasks.splice(index, 1);
      saveTasks();
      drawTasks();
    };

    updateTitle();
    label.appendChild(checkbox);
    label.appendChild(title);
    item.appendChild(star);
    item.appendChild(label);
    item.appendChild(button);
    list.appendChild(item);
  });
}
  form.onsubmit = function(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    tasks.push({ text: text, done: false });
    saveTasks();
    drawTasks();

    input.value = '';
    input.focus();
  };

  drawTasks();
</script>
</body>
</html>
